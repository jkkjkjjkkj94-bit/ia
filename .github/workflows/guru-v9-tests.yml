name: GURU V9 tests
on:
  push:
    paths:
      - 'guru-ranking-v9.mjs'
      - 'guru-context-v10.mjs'
      - 'tests/guru-v10.test.mjs'
      - 'guru-engine-v4-core.mjs'
      - 'tests/guru-v9.test.mjs'
      - '.github/workflows/guru-v9-tests.yml'
  workflow_dispatch:
jobs:
  tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/guru-v9.test.mjs tests/guru-v10.test.mjs
