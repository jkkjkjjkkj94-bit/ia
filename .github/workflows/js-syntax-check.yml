name: JavaScript Syntax Check

on:
  push:
    paths:
      - '**/*.js'
      - '**/*.mjs'
      - 'index.html'
      - 'admin.html'
      - 'lojista.html'
      - 'tests/guru-v4-smoke.html'
      - 'tests/admin-ui-smoke.html'
      - 'tests/admin-classification-smoke.html'
      - '.github/workflows/js-syntax-check.yml'
  workflow_dispatch:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Validate every JavaScript file
        shell: bash
        run: |
          set -euo pipefail
          count=0
          failed=0
          while IFS= read -r -d '' file; do
            count=$((count + 1))
            echo "Checking $file"
            if ! node --input-type=module --check < "$file"; then
              echo "::error file=$file::JavaScript syntax error"
              failed=1
            fi
          done < <(find . -type f \( -name '*.js' -o -name '*.mjs' \) -print0)
          echo "Checked $count JavaScript files."
          exit "$failed"
      - name: Verify semantic search regression tests
        run: node --test tests/guru-engine-v4.test.mjs tests/module-integration.test.mjs

      - name: Headless browser smoke test for GURU v4
        shell: bash
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/guru-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          sleep 2
          timeout 75s "$CHROME" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --disable-background-networking --virtual-time-budget=55000 --dump-dom "http://127.0.0.1:8765/tests/guru-v4-smoke.html" > /tmp/guru-smoke.html 2>/tmp/guru-chrome.log
          if ! grep -q 'data-smoke="PASS"' /tmp/guru-smoke.html; then
            echo "Browser smoke test failed";grep -o 'data-report="[^"]*"' /tmp/guru-smoke.html || true
            tail -n 25 /tmp/guru-chrome.log || true
            exit 1
          fi
          echo "GURU v4 browser interactions passed."
          timeout 45s "$CHROME" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --disable-background-networking --virtual-time-budget=15000 --dump-dom "http://127.0.0.1:8765/tests/admin-ui-smoke.html" > /tmp/guru-admin-smoke.html 2>/tmp/guru-admin-chrome.log
          if ! grep -q 'data-smoke="PASS"' /tmp/guru-admin-smoke.html; then
            echo "Admin UI smoke test failed"; grep -o 'data-report="[^"]*"' /tmp/guru-admin-smoke.html || true
            tail -n 25 /tmp/guru-admin-chrome.log || true
            exit 1
          fi
          echo "GURU Admin sidebar, tables and menu stability passed."
          timeout 45s "$CHROME" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --disable-background-networking --virtual-time-budget=12000 --dump-dom "http://127.0.0.1:8765/tests/admin-classification-smoke.html" > /tmp/guru-classification-smoke.html 2>/tmp/guru-classification-chrome.log
          if ! grep -q 'data-smoke="PASS"' /tmp/guru-classification-smoke.html; then
            echo "Admin classification smoke test failed"; grep -o 'data-report="[^"]*"' /tmp/guru-classification-smoke.html || true
            tail -n 25 /tmp/guru-classification-chrome.log || true
            exit 1
          fi
          echo "Admin classification save and error recovery passed."

