<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Local AI · Bancos de dados</title>
<link rel="stylesheet" href="panel.css?v=3">
<style>
.db-shell{min-height:100vh;background:#f7f7f7;color:#171717}.db-top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 22px;border-bottom:1px solid #e7e7e7;background:#fff;position:sticky;top:0;z-index:5}.db-top h1{font-size:20px;margin:0}.db-top p{margin:4px 0 0;color:#777;font-size:12px}.db-main{padding:20px;max-width:1500px;margin:auto}.db-toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}.db-tabs{display:flex;gap:8px}.db-tab{border:1px solid #ddd;background:#fff;border-radius:10px;padding:9px 12px;font-weight:700;cursor:pointer}.db-tab.on{background:#111;color:#fff;border-color:#111}.db-search{min-width:240px;flex:1;border:1px solid #ddd;border-radius:10px;padding:10px 12px}.db-layout{display:grid;grid-template-columns:300px minmax(0,1fr);gap:14px}.db-side,.db-content{background:#fff;border:1px solid #e5e5e5;border-radius:14px}.db-side{padding:12px}.db-content{padding:14px;min-width:0}.db-summary{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:14px}.db-stat{border:1px solid #e8e8e8;border-radius:12px;padding:12px}.db-stat span{display:block;color:#888;font-size:11px}.db-stat b{font-size:18px}.table-list{display:flex;flex-direction:column;gap:6px;max-height:660px;overflow:auto}.table-btn{width:100%;text-align:left;border:1px solid transparent;background:#fafafa;border-radius:9px;padding:9px 10px;cursor:pointer}.table-btn:hover,.table-btn.on{border-color:#d8d8d8;background:#f2f2f2}.table-btn b{display:block;font-size:12px;overflow:hidden;text-overflow:ellipsis}.table-btn span{font-size:10px;color:#888}.db-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;margin-bottom:10px}.db-head h2{font-size:16px;margin:0}.db-head .meta{font-size:11px;color:#888;margin-top:3px}.grid-wrap{overflow:auto;border:1px solid #e8e8e8;border-radius:10px}.data-grid{width:100%;border-collapse:collapse;font-size:11px;white-space:nowrap}.data-grid th,.data-grid td{padding:8px 9px;border-bottom:1px solid #eee;border-right:1px solid #f2f2f2;text-align:left;max-width:260px;overflow:hidden;text-overflow:ellipsis}.data-grid th{background:#fafafa;position:sticky;top:0;z-index:1}.data-grid td.obj{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;color:#555}.pager{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:10px}.pager .btns{display:flex;gap:7px}.empty{padding:34px 12px;text-align:center;color:#888}.badge-db{display:inline-flex;padding:4px 7px;border-radius:999px;background:#f2f2f2;font-size:10px;font-weight:700}.notice{padding:10px 12px;background:#fafafa;border:1px solid #e7e7e7;border-radius:10px;font-size:11px;color:#666;margin-bottom:12px}.hidden{display:none!important}@media(max-width:850px){.db-layout{grid-template-columns:1fr}.db-summary{grid-template-columns:1fr}.db-top{align-items:flex-start}.db-main{padding:12px}.table-list{max-height:300px}}
</style>
</head>
<body>
<div class="db-shell">
  <header class="db-top">
    <div><h1>Explorador de bancos</h1><p>Visualização somente leitura dos dados do Local AI.</p></div>
    <div style="display:flex;gap:8px"><a class="btn" href="admin.html">Voltar ao admin</a><button id="logoutBtn" class="btn">Sair</button></div>
  </header>
  <main class="db-main">
    <div id="status" class="notice">Validando sessão administrativa…</div>
    <div id="app" class="hidden">
      <div class="db-toolbar">
        <div class="db-tabs"><button class="db-tab on" data-db="hibrid">HIBRID</button><button class="db-tab" data-db="core">CORE</button></div>
        <input id="tableSearch" class="db-search" placeholder="Pesquisar tabela…">
        <button id="refreshBtn" class="btn">Atualizar</button>
      </div>
      <div class="db-summary">
        <div class="db-stat"><span>Banco selecionado</span><b id="dbName">HIBRID</b></div>
        <div class="db-stat"><span>Tabelas disponíveis</span><b id="tableCount">0</b></div>
        <div class="db-stat"><span>Registros visíveis</span><b id="visibleRows">0</b></div>
      </div>
      <div class="db-layout">
        <aside class="db-side">
          <div class="notice" id="storageInfo">Storage HIBRID: <b>store-logos</b></div>
          <div id="tableList" class="table-list"></div>
        </aside>
        <section class="db-content">
          <div id="tableEmpty" class="empty">Selecione uma tabela para visualizar os dados.</div>
          <div id="tableView" class="hidden">
            <div class="db-head"><div><h2 id="tableTitle"></h2><div class="meta" id="tableMeta"></div></div><span id="accessMode" class="badge-db">Somente leitura</span></div>
            <div id="gridWrap" class="grid-wrap"></div>
            <div class="pager"><span id="pageInfo" class="meta"></span><div class="btns"><button id="prevBtn" class="btn sm">Anterior</button><button id="nextBtn" class="btn sm">Próxima</button></div></div>
          </div>
        </section>
      </div>
    </div>
  </main>
</div>
<script type="module">
import{createClient}from'https://esm.sh/@supabase/supabase-js@2.95.0';
const H_URL='https://innziuzgtpfsiywqmies.supabase.co';
const H_KEY='sb_publishable_'+'fJB7zijdznI9ob9l9jSGlQ_6oU_J-d1';
const C_URL='https://ccsypggvelcxsqszepfs.supabase.co';
const C_KEY='sb_publishable_zBA2v4pRgaaAv1VeV2d-Uw_rIrt4ZxG';
const h=createClient(H_URL,H_KEY,{auth:{persistSession:true,autoRefreshToken:true}});
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const H_TABLES=['local_ai_profiles','local_ai_accounts','local_ai_stores','local_ai_products','local_ai_store_hours','local_ai_product_variants','local_ai_store_knowledge','local_ai_store_questions','local_ai_reviews','local_ai_search_events','local_ai_admin_audit','local_ai_data_sources','local_ai_store_highlights','local_ai_ai_config','local_ai_synonym_suggestions'];
const C_TABLES=['local_ai_stores','local_ai_products'];
let db='hibrid',selected='',page=1,total=0,counts={},limit=25,session=null;
function tables(){return db==='hibrid'?H_TABLES:C_TABLES}
async function coreFetch(path,opts={}){const headers={apikey:C_KEY,Authorization:'Bearer '+C_KEY,Accept:'application/json',...(opts.headers||{})};return fetch(C_URL+'/rest/v1/'+path,{...opts,headers})}
async function countTable(name){try{if(db==='hibrid'){const{count,error}=await h.from(name).select('*',{count:'exact',head:true});if(error)throw error;return count||0}const r=await coreFetch(name+'?select=*',{method:'HEAD',headers:{Prefer:'count=exact'}});const range=r.headers.get('content-range')||'';const n=Number(range.split('/')[1]);return Number.isFinite(n)?n:0}catch{return 0}}
async function loadCounts(){counts={};await Promise.all(tables().map(async t=>counts[t]=await countTable(t)));renderTables();$('tableCount').textContent=tables().length;$('visibleRows').textContent=Object.values(counts).reduce((a,b)=>a+Number(b||0),0).toLocaleString('pt-BR')}
function renderTables(){const q=$('tableSearch').value.trim().toLowerCase();$('tableList').innerHTML=tables().filter(t=>!q||t.toLowerCase().includes(q)).map(t=>`<button class="table-btn ${selected===t?'on':''}" data-table="${esc(t)}"><b>${esc(t)}</b><span>${Number(counts[t]||0).toLocaleString('pt-BR')} registro(s)</span></button>`).join('')||'<div class="empty">Nenhuma tabela encontrada.</div>';document.querySelectorAll('[data-table]').forEach(b=>b.onclick=()=>openTable(b.dataset.table,1))}
function cell(v){if(v===null||v===undefined)return '—';if(typeof v==='object')return esc(JSON.stringify(v));return esc(String(v))}
async function rows(name,p){const from=(p-1)*limit,to=from+limit-1;if(db==='hibrid'){const{data,error,count}=await h.from(name).select('*',{count:'exact'}).range(from,to);if(error)throw error;return{data:data||[],count:count||0}}const r=await coreFetch(`${name}?select=*&offset=${from}&limit=${limit}`,{headers:{Prefer:'count=exact'}});if(!r.ok)throw new Error('CORE HTTP '+r.status);const range=r.headers.get('content-range')||'';const count=Number(range.split('/')[1]);return{data:await r.json(),count:Number.isFinite(count)?count:0}}
async function openTable(name,p=1){selected=name;page=p;renderTables();$('tableEmpty').classList.add('hidden');$('tableView').classList.remove('hidden');$('tableTitle').textContent=name;$('gridWrap').innerHTML='<div class="empty">Carregando…</div>';try{const r=await rows(name,p);total=r.count;const data=r.data;const cols=[...new Set(data.flatMap(x=>Object.keys(x)))];$('tableMeta').textContent=`${total.toLocaleString('pt-BR')} registro(s) · ${cols.length} coluna(s) · página ${page}`;$('pageInfo').textContent=`Mostrando ${data.length?((page-1)*limit+1):0}–${Math.min(page*limit,total)} de ${total}`;$('prevBtn').disabled=page<=1;$('nextBtn').disabled=page*limit>=total;if(!data.length){$('gridWrap').innerHTML='<div class="empty">Esta tabela não possui registros visíveis.</div>';return}$('gridWrap').innerHTML=`<table class="data-grid"><thead><tr>${cols.map(c=>`<th>${esc(c)}</th>`).join('')}</tr></thead><tbody>${data.map(row=>`<tr>${cols.map(c=>`<td class="${typeof row[c]==='object'&&row[c]!==null?'obj':''}" title="${esc(typeof row[c]==='object'&&row[c]!==null?JSON.stringify(row[c]):String(row[c]??''))}">${cell(row[c])}</td>`).join('')}</tr>`).join('')}</tbody></table>`}catch(e){$('gridWrap').innerHTML=`<div class="empty">Não foi possível ler esta tabela.<br><small>${esc(e.message||e)}</small></div>`}}
async function changeDb(next){db=next;selected='';page=1;document.querySelectorAll('[data-db]').forEach(b=>b.classList.toggle('on',b.dataset.db===db));$('dbName').textContent=db==='hibrid'?'HIBRID':'CORE';$('storageInfo').innerHTML=db==='hibrid'?'Storage HIBRID: <b>store-logos</b>':'CORE: visualização das tabelas públicas principais';$('tableView').classList.add('hidden');$('tableEmpty').classList.remove('hidden');await loadCounts()}
$('tableSearch').oninput=renderTables;document.querySelectorAll('[data-db]').forEach(b=>b.onclick=()=>changeDb(b.dataset.db));$('refreshBtn').onclick=async()=>{await loadCounts();if(selected)await openTable(selected,page)};$('prevBtn').onclick=()=>selected&&page>1&&openTable(selected,page-1);$('nextBtn').onclick=()=>selected&&page*limit<total&&openTable(selected,page+1);$('logoutBtn').onclick=async()=>{await h.auth.signOut();location.href='admin.html'};
const{data:{session:s}}=await h.auth.getSession();session=s;if(!session){location.href='admin.html'}else{const{data:p,error}=await h.from('local_ai_profiles').select('role').eq('user_id',session.user.id).maybeSingle();if(error||p?.role!=='admin'){await h.auth.signOut();location.href='admin.html'}else{$('status').textContent='Sessão administrativa validada. O explorador não permite editar nem excluir dados.';$('app').classList.remove('hidden');await loadCounts()}}
</script>
</body>
</html>
