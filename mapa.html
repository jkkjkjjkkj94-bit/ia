<header><a href="./" class="back" aria-label="Voltar ao GOOY">←</a><a class="brand" href="./"><img src="gooy-mark.svg?v=1" alt="">GOOY <small>Maps</small></a><button class="gooy-top-action account" type="button" id="gooyAccount" aria-label="Conta">◉</button><button class="gooy-top-action" type="button" id="gooyAlerts" aria-label="Notificações">♧</button><div class="head-actions"><button type="button" id="focusSearch" aria-label="Buscar">⌕</button></div></header>
<main><aside><div class="controls"><h1>Mapa de estabelecimentos</h1><p>Explore os locais cadastrados e ativos.</p><div class="search-line"><input class="field" id="search" type="search" placeholder="Buscar estabelecimentos, categoria ou endereço" aria-label="Buscar estabelecimentos"><button class="filter-btn" id="filterBtn" type="button" aria-label="Filtrar por cidade" aria-expanded="false">☷</button></div><div class="category-chips" id="categoryChips" aria-label="Filtrar categoria"><button type="button" class="active" data-category="Todos">▦ &nbsp; Todos</button><button type="button" data-category="Alimentação">♜ &nbsp; Alimentação</button><button type="button" data-category="Compras">▢ &nbsp; Compras</button><button type="button" data-category="Serviços">⚒ &nbsp; Serviços</button><button type="button" data-category="Saúde">✚ &nbsp; Saúde</button></div><select class="field city-field" id="city" aria-label="Filtrar por cidade"><option value="">Todas as cidades</option></select><div class="meta-row"><div class="meta" id="count" role="status">Carregando estabelecimentos…</div><button class="list-toggle" id="listToggle" type="button" aria-expanded="false" aria-controls="list">Ver lista ↑</button></div></div><div class="list" id="list" aria-label="Estabelecimentos"><div class="list-title">Estabelecimentos no mapa</div></div></aside><section class="map-wrap" aria-label="Mapa interativo de estabelecimentos"><div id="map"></div><div id="notice" class="notice" hidden></div><div class="map-tools"><button id="mapLocate" type="button" aria-label="Minha localização">◎</button><button id="mapZoomIn" type="button" aria-label="Aproximar">+</button><button id="mapZoomOut" type="button" aria-label="Afastar">−</button></div><div class="map-count" id="mapCount">Carregando...<span>Estabelecimentos no mapa</span></div></section></main><nav class="gooy-bottom-nav" aria-label="Navegação"><button type="button" class="active" id="gooyNavMap"><span class="nav-icon">⌖</span>Mapa</button><button type="button" id="gooyNavExplore"><span class="nav-icon">◈</span>Explorar</button><button type="button" id="gooyNavFavorites"><span class="nav-icon">♡</span>Favoritos</button><a href="./"><span class="nav-icon">▦</span>Mais</a></nav>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script type="module">
const API='https://ccsypggvelcxsqszepfs.supabase.co/rest/v1/local_ai_stores';
const KEY='sb_publishable_zBA2v4pRgaaAv1VeV2d-Uw_rIrt4ZxG';
const el=id=>document.getElementById(id),search=el('search'),city=el('city'),list=el('list'),count=el('count'),notice=el('notice');
const norm=s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
const safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const coords=s=>{const lat=Number(s.latitude),lng=Number(s.longitude);return s.latitude!=null&&s.longitude!=null&&Number.isFinite(lat)&&Number.isFinite(lng)&&Math.abs(lat)<=90&&Math.abs(lng)<=180&&(lat!==0||lng!==0)?[lat,lng]:null};
const cityOf=s=>{const a=String(s.address||'');const m=a.match(/(?:^|[,\-])\s*([^,\-]+?)\s*-\s*[A-Z]{2}(?:\s|$)/i);return m?m[1].trim():''};
let stores=[],markers=[],map,layer,selectedId=null,activeCategory='Todos',showUnlocated=false;
if(window.L){map=L.map('map',{zoomControl:true}).setView([-23.5,-47.4],9);const baseTiles=L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap contributors',crossOrigin:true});baseTiles.addTo(map);let tileFailures=0;baseTiles.on('tileerror',()=>{tileFailures++;if(tileFailures>=4){notice.hidden=false;notice.textContent='Não foi possível carregar as ruas. Verifique a conexão e atualize a página.'}});baseTiles.on('tileload',()=>{if(tileFailures){tileFailures=0;notice.hidden=true}});layer=L.layerGroup().addTo(map)}else{notice.hidden=false;notice.textContent='Mapa indisponível neste navegador. Você ainda pode consultar a lista de estabelecimentos.'}
function render(){list.classList.remove('has-selection');const term=norm(search.value.trim()),c=city.value;const filtered=stores.filter(s=>(!c||cityOf(s)===c)&&(!term||norm([s.name,s.category,s.group,s.address,(s.specialties||[]).join(' ')].join(' ')).includes(term))&&(activeCategory==='Todos'||categoryMatches(s,activeCategory)));const plotted=filtered.filter(s=>coords(s));const visible=showUnlocated?filtered:plotted;count.textContent=filtered.length+' estabelecimento(s) · '+plotted.length+' no mapa';el('mapCount').innerHTML=plotted.length.toLocaleString('pt-BR')+' no mapa<span>'+filtered.length.toLocaleString('pt-BR')+' cadastrados nos filtros</span>';list.replaceChildren();const heading=document.createElement('h2');heading.className='list-title';heading.textContent=showUnlocated?'Estabelecimentos cadastrados':'Estabelecimentos no mapa';list.append(heading);const switcher=document.createElement('button');switcher.type='button';switcher.className='unlocated-switch';switcher.textContent=showUnlocated?'Mostrar apenas no mapa':'Ver também sem localização ('+(filtered.length-plotted.length)+')';switcher.addEventListener('click',()=>{showUnlocated=!showUnlocated;render()});list.append(switcher);if(layer)layer.clearLayers();markers=[];const bounds=[];
for(const s of visible){const point=coords(s),item=document.createElement('button');item.type='button';item.className='item';item.innerHTML='<strong>'+safe(s.name||'Estabelecimento')+'</strong><span class="tag">'+safe(s.category||s.group||'Comércio')+'</span><span>'+safe(s.address||'Endereço não informado')+'</span>'+(!point?'<span>Sem coordenadas cadastradas</span>':'');list.append(item);
if(point&&layer){const marker=L.marker(point,{icon:L.divIcon({className:'pin',iconSize:[24,24],iconAnchor:[12,24]})});const url='https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(point.join(','));marker.bindPopup('<strong>'+safe(s.name||'Estabelecimento')+'</strong><div>'+safe(s.address||'Endereço não informado')+'</div><a href="'+url+'" target="_blank" rel="noopener noreferrer">Abrir rota no Google Maps</a>');marker.addTo(layer);markers.push(marker);bounds.push(point);marker.on('click',()=>{showSelectedStore(s,point);map.panTo(point)});item.addEventListener('click',()=>{showSelectedStore(s,point);map.setView(point,Math.max(map.getZoom(),15))})}else item.addEventListener('click',()=>{notice.hidden=false;notice.textContent='Este estabelecimento ainda não tem coordenadas válidas cadastradas.'})}
if(!visible.length){const empty=document.createElement('p');empty.className='empty';empty.textContent=filtered.length?'Nenhum estabelecimento com coordenadas cadastradas para estes filtros. Use “Ver também sem localização” para consultar os demais.':'Nenhum estabelecimento cadastrado encontrado para estes filtros.';list.append(empty)}if(map&&bounds.length){map.fitBounds(bounds,{padding:[35,35],maxZoom:14});setTimeout(()=>map.invalidateSize(),50)}if(map&&!bounds.length){notice.hidden=false;notice.textContent=filtered.length?'Nenhum estabelecimento cadastrado com localização válida neste filtro.':'Nenhum estabelecimento cadastrado encontrado neste filtro.'}else if(map)notice.hidden=true}
async function load(){try{let all=[];for(let offset=0;offset<50000;offset+=1000){const response=await fetch(API+'?select=*&active=eq.true&status=eq.active&order=id.asc&limit=1000&offset='+offset,{headers:{apikey:KEY,Authorization:'Bearer '+KEY}});if(!response.ok)throw new Error('HTTP '+response.status);const batch=await response.json();if(!Array.isArray(batch))throw new Error('Resposta inválida');all.push(...batch);if(batch.length<1000)break}stores=all;const cities=[...new Set(stores.map(cityOf).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'pt-BR'));for(const name of cities){const option=document.createElement('option');option.value=name;option.textContent=name;city.append(option)}render()}catch(e){count.textContent='Não foi possível carregar os estabelecimentos';list.innerHTML='<p class="empty">Confira a conexão e tente novamente.</p>';notice.hidden=false;notice.textContent='Falha ao consultar o cadastro: '+e.message;console.error('[GOOY mapa]',e)}}
const toggle=el('listToggle');
const resultsPanel=el('list');
resultsPanel.addEventListener('click',event=>{if(event.target.closest('button'))return;if(event.clientY-resultsPanel.getBoundingClientRect().top>35)return;const expanded=document.querySelector('main').classList.toggle('list-expanded');toggle.setAttribute('aria-expanded',String(expanded));toggle.textContent=expanded?'Recolher lista ↓':'Ver lista ↑';if(map)setTimeout(()=>map.invalidateSize(),220)});
toggle.addEventListener('click',()=>{const expanded=document.querySelector('main').classList.toggle('list-expanded');toggle.setAttribute('aria-expanded',String(expanded));toggle.textContent=expanded?'Recolher lista ↓':'Ver lista ↑';if(map)setTimeout(()=>map.invalidateSize(),220)});
const gooyFavoriteKey='gooy-map-favorites-v1';
function readFavorites(){try{return JSON.parse(localStorage.getItem(gooyFavoriteKey)||'[]')}catch{return []}}
function storeFavoriteId(store){return String(store.id??[store.name,store.address].join('|'))}
function toggleFavorite(store){const id=storeFavoriteId(store);const values=readFavorites();const next=values.includes(id)?values.filter(x=>x!==id):[...values,id];try{localStorage.setItem(gooyFavoriteKey,JSON.stringify(next))}catch(e){console.warn('Favoritos indisponíveis',e)}return next.includes(id)}
function setGooyNav(name){document.querySelectorAll('.gooy-bottom-nav button').forEach(b=>b.classList.toggle('active',b.id===name))}
function showSelectedStore(store,point){
 list.replaceChildren();list.classList.add('has-selection');
 const panel=document.createElement('div');panel.className='gooy-selected-card';
 const name=safe(store.name||'Estabelecimento'),category=safe(store.category||store.group||'Comércio'),address=safe(store.address||'Endereço não informado');
 const route='https://www.google.com/maps/dir/?api=1&destination='+encodeURIComponent(point.join(','));
 panel.innerHTML='<div class="selected-head"><div class="selected-icon" aria-hidden="true">▣</div><div><h2>'+name+'</h2><div class="selected-category">'+category+'</div></div><button class="selected-close" type="button" aria-label="Fechar detalhes">×</button></div><p class="selected-address">⌖ '+address+'</p><div class="selected-actions"><a class="primary" href="'+route+'" target="_blank" rel="noopener noreferrer">↗ Ver rota</a><button type="button" class="selected-share">Compartilhar</button><button type="button" class="selected-favorite">'+(readFavorites().includes(storeFavoriteId(store))?'♥ Salvo':'♡ Salvar')+'</button></div>';
 panel.querySelector('.selected-close').addEventListener('click',()=>{list.classList.remove('has-selection');render()});
 panel.querySelector('.selected-favorite').addEventListener('click',()=>{panel.querySelector('.selected-favorite').textContent=toggleFavorite(store)?'♥ Salvo':'♡ Salvar'});
 panel.querySelector('.selected-share').addEventListener('click',async()=>{const link='https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(point.join(','));if(navigator.share){try{await navigator.share({title:store.name||'Estabelecimento',url:link})}catch(e){if(e.name!=='AbortError')console.warn(e)}}else if(navigator.clipboard){try{await navigator.clipboard.writeText(link);panel.querySelector('.selected-share').textContent='Link copiado'}catch(e){console.warn(e)}}});
 list.append(panel);document.querySelector('main').classList.remove('list-expanded');
}
function categoryMatches(s,cat){const v=norm([s.category,s.group,(s.specialties||[]).join(' ')].join(' '));const patterns={'Alimentação':/aliment|restaur|pizz|lanch|padaria|doceria|mercado|comida|cafe/,'Compras':/roup|moda|loja|varejo|compr|calcad|acessor|moveis|eletro|shopping/,'Serviços':/servic|construc|oficina|reparo|beleza|barbear|arquitet|informatica/,'Saúde':/saude|farmac|clinic|medic|odonto|hospital|laborat/};return patterns[cat]?.test(v)??true}
el('categoryChips').addEventListener('click',e=>{const b=e.target.closest('[data-category]');if(!b)return;activeCategory=b.dataset.category;el('categoryChips').querySelectorAll('button').forEach(x=>x.classList.toggle('active',x===b));render()});
el('filterBtn').addEventListener('click',()=>{const open=city.classList.toggle('open');el('filterBtn').setAttribute('aria-expanded',String(open));if(open)city.focus()});
el('focusSearch').addEventListener('click',()=>search.focus());
el('mapZoomIn').addEventListener('click',()=>map?.zoomIn());el('mapZoomOut').addEventListener('click',()=>map?.zoomOut());
el('mapLocate').addEventListener('click',()=>{if(!navigator.geolocation){notice.hidden=false;notice.textContent='Localização não disponível neste navegador.';return}navigator.geolocation.getCurrentPosition(p=>{map?.setView([p.coords.latitude,p.coords.longitude],14)},()=>{notice.hidden=false;notice.textContent='Não foi possível acessar sua localização.'},{enableHighAccuracy:false,timeout:10000})});
el('gooyNavMap').addEventListener('click',()=>{showUnlocated=false;search.value='';activeCategory='Todos';city.value='';document.querySelectorAll('#categoryChips button').forEach(b=>b.classList.toggle('active',b.dataset.category==='Todos'));setGooyNav('gooyNavMap');render()});
el('gooyNavExplore').addEventListener('click',()=>{setGooyNav('gooyNavExplore');document.querySelector('main').classList.add('list-expanded');showUnlocated=true;render();list.scrollTop=0});
el('gooyNavFavorites').addEventListener('click',()=>{setGooyNav('gooyNavFavorites');const fav=readFavorites();const found=stores.filter(x=>fav.includes(storeFavoriteId(x)));list.replaceChildren();list.classList.remove('has-selection');const heading=document.createElement('h2');heading.className='list-title';heading.textContent='Seus favoritos';list.append(heading);if(!found.length){const p=document.createElement('p');p.className='empty';p.textContent='Nenhum estabelecimento salvo ainda. Selecione um marcador e toque em Salvar.';list.append(p)}for(const x of found){const btn=document.createElement('button');btn.type='button';btn.className='item';btn.innerHTML='<strong>'+safe(x.name)+'</strong><span>'+safe(x.address||'Endereço não informado')+'</span>';btn.addEventListener('click',()=>{const p=coords(x);if(p){showSelectedStore(x,p);map?.setView(p,15)}else{notice.hidden=false;notice.textContent='Este favorito não tem coordenadas cadastradas.'}});list.append(btn)}document.querySelector('main').classList.add('list-expanded')});
el('gooyAccount').addEventListener('click',()=>{window.location.href='./'});
el('gooyAlerts').addEventListener('click',()=>{notice.hidden=false;notice.textContent='As notificações ainda não estão disponíveis no mapa.'});
search.addEventListener('input',render);city.addEventListener('change',render);
let mapResizeFrame=0;
function refreshMapSize(){if(!map)return;cancelAnimationFrame(mapResizeFrame);mapResizeFrame=requestAnimationFrame(()=>map.invalidateSize({pan:false}))}
window.addEventListener('orientationchange',()=>setTimeout(refreshMapSize,250),{passive:true});
window.addEventListener('resize',()=>{if(map)map.invalidateSize({pan:false})},{passive:true});
if(window.visualViewport)window.visualViewport.addEventListener('resize',()=>{if(map)map.invalidateSize({pan:false})},{passive:true});
load();
</script></body></html>
