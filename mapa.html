<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#ffffff"><title>Mapa de estabelecimentos · GOOY AI</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
*{box-sizing:border-box}body{margin:0;font:14px system-ui,-apple-system,"Segoe UI",sans-serif;color:#151515;background:#fff}button,input,select{font:inherit}button{cursor:pointer}header{height:66px;display:flex;align-items:center;gap:16px;padding:0 clamp(14px,3vw,32px);border-bottom:1px solid #ececec}header a{color:inherit;text-decoration:none}header .brand{font-size:19px;font-weight:800;letter-spacing:-.05em}header .brand small{font-size:10px;letter-spacing:0}header .back{font-size:13px;color:#777}main{height:calc(100dvh - 66px);display:grid;grid-template-columns:minmax(290px,355px) minmax(0,1fr)}aside{display:flex;flex-direction:column;min-height:0;border-right:1px solid #ececec}aside .controls{padding:20px;border-bottom:1px solid #eee}h1{font-size:24px;letter-spacing:-.045em;margin:0 0 6px}p{margin:0;color:#777;line-height:1.5}.controls .field{margin-top:14px;width:100%;padding:12px 13px;border:1px solid #e3e3e3;border-radius:12px;background:white;outline-offset:2px}.meta{margin:12px 0 0;color:#777;font-size:12px}.list{overflow-y:auto;min-height:0;padding:10px}.item{width:100%;display:block;text-align:left;border:1px solid transparent;border-bottom-color:#f0f0f0;background:#fff;padding:14px 10px;border-radius:10px}.item:hover,.item:focus-visible{background:#f7f7f7}.item strong{display:block;font-size:14px;margin-bottom:4px}.item span{display:block;font-size:12px;color:#777;line-height:1.5}.item .tag{color:#444}.map-wrap{position:relative;min-height:0}#map{width:100%;height:100%;background:#f4f4f4}.notice{position:absolute;z-index:500;top:14px;left:14px;right:14px;max-width:450px;background:#fff;border:1px solid #e7e7e7;border-radius:12px;padding:12px 14px;box-shadow:0 5px 20px #0001;font-size:12px;color:#555}.notice[hidden]{display:none}.leaflet-popup-content{font:13px system-ui;line-height:1.55}.leaflet-popup-content strong{font-size:15px}.leaflet-popup-content a{color:#111;font-weight:650}.pin{background:#111;border:2px solid #fff;border-radius:50%;box-shadow:0 2px 8px #0004}.empty{padding:20px;color:#777;line-height:1.5}.leaflet-container{font-family:inherit}@media(max-width:700px){header{height:58px}main{height:calc(100dvh - 58px);display:flex;flex-direction:column}aside{height:44%;min-height:235px;border-right:0;border-bottom:1px solid #eee}aside .controls{padding:12px 16px}h1{font-size:20px}.controls .field{margin-top:8px;padding:10px}.controls .meta{margin-top:6px}.list{padding:2px 10px}.item{padding:9px}.map-wrap{flex:1;min-height:220px}.notice{top:8px;left:8px;right:8px}}@media(prefers-color-scheme:dark){body{background:#fff;color:#151515}}

/* GOOY Maps 2.0 — mapa monocromático e layout mobile-first */
.leaflet-tile-pane{filter:grayscale(1) contrast(1.08) brightness(1.04)}
.leaflet-control-zoom{border:1px solid #e6e6e6!important;border-radius:13px!important;overflow:hidden;box-shadow:0 3px 12px #00000012!important}
.leaflet-control-zoom a{color:#151515!important;background:#fff!important;border-color:#ededed!important}
.leaflet-control-attribution{background:#ffffffd9!important;color:#555!important;font-size:10px!important}
.pin{width:17px;height:17px;background:#111;border:3px solid white;border-radius:50%;box-shadow:0 2px 9px #0005}
header{background:#fff}header .brand{letter-spacing:-.055em}h1{font-weight:750}
.controls .field{transition:border-color .15s,box-shadow .15s}.controls .field:focus{border-color:#222;outline:0;box-shadow:0 0 0 3px #0000000a}
.item{transition:background .15s}.item strong{letter-spacing:-.015em}
.list-toggle{display:none;border:1px solid #e9e9e9;border-radius:999px;background:#fff;padding:8px 12px;color:#111;font-weight:650;font-size:12px}
.meta-row{display:flex;align-items:center;justify-content:space-between;gap:10px}
@media(max-width:700px){
 header{height:56px;padding-inline:16px;border-bottom:1px solid #f0f0f0}
 header .brand{font-size:18px}header .back{font-size:12px}
 main{height:calc(100dvh - 56px);height:calc(100svh - 56px);display:flex;flex-direction:column;overflow:hidden}
 aside{display:contents}
 aside .controls{order:0;flex:0 0 auto;padding:14px 16px 11px;background:#fff;border-bottom:1px solid #eee}
 h1{font-size:21px;line-height:1.2;margin-bottom:4px}
 aside .controls>p{font-size:12px}
 .controls .field{height:42px;padding:9px 12px;margin-top:9px;border-radius:11px;font-size:14px}
 .controls .meta{margin-top:0;font-size:11px;line-height:1.3}
 .meta-row{margin-top:9px}
 .list-toggle{display:inline-flex;align-items:center;gap:5px;flex:0 0 auto}
 .map-wrap{order:1;flex:1 1 auto;min-height:160px;position:relative}
 .list{order:2;flex:0 0 152px;height:152px;min-height:0;overflow-y:auto;overscroll-behavior:contain;background:#fff;border-top:1px solid #e8e8e8;padding:3px 12px max(8px,env(safe-area-inset-bottom))}
 .item{padding:10px 8px;border-radius:9px}
 .item strong{font-size:13px;margin-bottom:2px}
 .item span{font-size:11px;line-height:1.45}
 main.list-expanded .list{flex-basis:min(48svh,400px);height:min(48svh,400px)}
 main.list-expanded .map-wrap{min-height:130px}
 .notice{font-size:11px;top:10px;left:10px;right:10px;padding:9px 11px;border-radius:10px}
 .leaflet-control-zoom{margin-top:12px!important;margin-left:12px!important}
}
@media(max-width:390px){aside .controls{padding:10px 12px 8px}h1{font-size:19px}.controls .field{height:38px;margin-top:7px}.list{flex-basis:120px;height:120px}}
@media(max-height:650px) and (max-width:700px){aside .controls>p{display:none}aside .controls{padding-top:9px;padding-bottom:8px}.controls .field{height:36px;margin-top:6px}.meta-row{margin-top:6px}.list{flex-basis:105px;height:105px}}
</style></head><body>
<header><a href="./" class="back" aria-label="Voltar ao GOOY">← Voltar</a><a class="brand" href="./">GOOY <small>AI</small></a></header>
<main><aside><div class="controls"><h1>Mapa de estabelecimentos</h1><p>Explore os locais cadastrados e ativos.</p><input class="field" id="search" type="search" placeholder="Buscar nome, categoria ou endereço" aria-label="Buscar estabelecimentos"><select class="field" id="city" aria-label="Filtrar por cidade"><option value="">Todas as cidades</option></select><div class="meta-row"><div class="meta" id="count" role="status">Carregando estabelecimentos…</div><button class="list-toggle" id="listToggle" type="button" aria-expanded="false" aria-controls="list">Ver lista ↑</button></div></div><div class="list" id="list"></div></aside><section class="map-wrap" aria-label="Mapa interativo de estabelecimentos"><div id="map"></div><div id="notice" class="notice" hidden></div></section></main>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script type="module">
const API='https://ccsypggvelcxsqszepfs.supabase.co/rest/v1/local_ai_stores';
const KEY='sb_publishable_zBA2v4pRgaaAv1VeV2d-Uw_rIrt4ZxG';
const el=id=>document.getElementById(id),search=el('search'),city=el('city'),list=el('list'),count=el('count'),notice=el('notice');
const norm=s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
const safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const coords=s=>{const lat=Number(s.latitude),lng=Number(s.longitude);return s.latitude!=null&&s.longitude!=null&&Number.isFinite(lat)&&Number.isFinite(lng)&&Math.abs(lat)<=90&&Math.abs(lng)<=180&&(lat!==0||lng!==0)?[lat,lng]:null};
const cityOf=s=>{const a=String(s.address||'');const m=a.match(/(?:^|[,\-])\s*([^,\-]+?)\s*-\s*[A-Z]{2}(?:\s|$)/i);return m?m[1].trim():''};
let stores=[],markers=[],map,layer,selectedId=null;
if(window.L){map=L.map('map',{zoomControl:true}).setView([-23.5,-47.4],9);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap contributors'}).addTo(map);layer=L.layerGroup().addTo(map)}else{notice.hidden=false;notice.textContent='Mapa indisponível neste navegador. Você ainda pode consultar a lista de estabelecimentos.'}
function render(){const term=norm(search.value.trim()),c=city.value;const filtered=stores.filter(s=>(!c||cityOf(s)===c)&&(!term||norm([s.name,s.category,s.group,s.address,(s.specialties||[]).join(' ')].join(' ')).includes(term)));const plotted=filtered.filter(s=>coords(s));count.textContent=filtered.length+' estabelecimento(s) · '+plotted.length+' no mapa';list.replaceChildren();if(layer)layer.clearLayers();markers=[];const bounds=[];
for(const s of filtered){const point=coords(s),item=document.createElement('button');item.type='button';item.className='item';item.innerHTML='<strong>'+safe(s.name||'Estabelecimento')+'</strong><span class="tag">'+safe(s.category||s.group||'Comércio')+'</span><span>'+safe(s.address||'Endereço não informado')+'</span>'+(!point?'<span>Sem coordenadas cadastradas</span>':'');list.append(item);
if(point&&layer){const marker=L.marker(point,{icon:L.divIcon({className:'pin',iconSize:[15,15],iconAnchor:[7,7]})});const url='https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(point.join(','));marker.bindPopup('<strong>'+safe(s.name||'Estabelecimento')+'</strong><div>'+safe(s.address||'Endereço não informado')+'</div><a href="'+url+'" target="_blank" rel="noopener noreferrer">Abrir rota no Google Maps</a>');marker.addTo(layer);markers.push(marker);bounds.push(point);item.addEventListener('click',()=>{map.setView(point,Math.max(map.getZoom(),15));marker.openPopup()})}else item.addEventListener('click',()=>{notice.hidden=false;notice.textContent='Este estabelecimento ainda não tem coordenadas válidas cadastradas.'})}
if(!filtered.length)list.innerHTML='<p class="empty">Nenhum estabelecimento encontrado para estes filtros.</p>';if(map&&bounds.length){map.fitBounds(bounds,{padding:[35,35],maxZoom:14});setTimeout(()=>map.invalidateSize(),50)}if(map&&!bounds.length){notice.hidden=false;notice.textContent=filtered.length?'Os estabelecimentos encontrados ainda não possuem coordenadas válidas.':'Nenhum ponto para os filtros selecionados.'}else if(map)notice.hidden=true}
async function load(){try{let all=[];for(let offset=0;offset<50000;offset+=1000){const response=await fetch(API+'?select=*&active=eq.true&status=eq.active&order=id.asc&limit=1000&offset='+offset,{headers:{apikey:KEY,Authorization:'Bearer '+KEY}});if(!response.ok)throw new Error('HTTP '+response.status);const batch=await response.json();if(!Array.isArray(batch))throw new Error('Resposta inválida');all.push(...batch);if(batch.length<1000)break}stores=all;const cities=[...new Set(stores.map(cityOf).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'pt-BR'));for(const name of cities){const option=document.createElement('option');option.value=name;option.textContent=name;city.append(option)}render()}catch(e){count.textContent='Não foi possível carregar os estabelecimentos';list.innerHTML='<p class="empty">Confira a conexão e tente novamente.</p>';notice.hidden=false;notice.textContent='Falha ao consultar o cadastro: '+e.message;console.error('[GOOY mapa]',e)}}
const toggle=el('listToggle');toggle.addEventListener('click',()=>{const expanded=document.querySelector('main').classList.toggle('list-expanded');toggle.setAttribute('aria-expanded',String(expanded));toggle.textContent=expanded?'Recolher lista ↓':'Ver lista ↑';if(map)setTimeout(()=>map.invalidateSize(),200)});
search.addEventListener('input',render);city.addEventListener('change',render);load();
</script></body></html>
