<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>GURU V4 Smoke</title><link rel="stylesheet" href="../guru-engine-v4.css?v=3"></head>
<body data-smoke="RUNNING">
<aside class="app-sidebar"><button type="button" class="sidebar-collapse">Menu</button><button data-shell-action="new">Nova busca</button><button data-shell-action="location">Localização</button></aside>
<section class="hero"><h1>GURU</h1><p>Encontre lojas e produtos.</p></section>
<div class="msgs" id="msgs"><div class="msg bot">Olá</div></div><div id="ctx"></div><div id="guruSuggestions" role="listbox" hidden></div>
<form id="chatForm"><input id="q"><button type="submit">Enviar</button></form>
<div id="toast"></div><button id="locBtn" type="button"></button><button id="resetBtn" type="button"></button>
<script>
// Headless Chrome pode reportar document.hidden=true mesmo no teste ativo.
// Simula uma aba visível para validar a animação sem alterar o código de produção.
Object.defineProperty(document,'hidden',{configurable:true,get:()=>false});
// A busca por cidade é obrigatória; prepare a cidade do catálogo de teste.
sessionStorage.setItem('guru_city_v1','Sorocaba');
const stores=[
 {id:'sushi',name:'Sushi Teste',category:'Comida',group:'Japonesa',groups:['Japonesa'],active:true,status:'active',address:'Rua A, Centro, Sorocaba - SP',delivery:true,delivery_fee:5,verified:false,payment_methods:['Pix']},
 {id:'pizza',name:'Pizza Teste',category:'Comida',group:'Pizzaria',groups:['Pizzaria'],active:true,status:'active',address:'Rua B, Centro, Sorocaba - SP',delivery:true,delivery_fee:6,verified:true,payment_methods:['Pix']},
 {id:'sweet',name:'Doceria Teste',category:'Comida',group:'Doceria',groups:['Doceria'],active:true,status:'active',address:'Rua C, Centro, Sorocaba - SP',delivery:false,pickup:false},
 {id:'pending',name:'Pendente Teste',category:'Comida',group:'Pizzaria',active:false,status:'pending',address:'Sorocaba - SP',delivery:true}
];
const products=[
 {id:'p1',store_id:'sushi',name:'Combo Sushi',stock:7,price:49,active:true,show_in_ai:true},
 {id:'p2',store_id:'pizza',name:'Pizza Tradicional',stock:4,price:50,promo_price:38,active:true,show_in_ai:true}
];
const hours=[
 {store_id:'sushi',weekday:6,opens_at:'18:00',closes_at:'23:00',closed:false},
 {store_id:'pizza',weekday:6,opens_at:'11:00',closes_at:'13:00',closed:false},
 {store_id:'pizza',weekday:6,opens_at:'17:00',closes_at:'23:00',closed:false},
 {store_id:'sweet',weekday:6,opens_at:'09:00',closes_at:'18:00',closed:false}
];
window.smokeFailHours=false;window.smokeFailReviews=false;window.smokeDisableStore=null;
window.fetch=async url=>{
 const path=String(url),table=(path.match(/\/rest\/v1\/(local_ai_[a-z_]+)/)||[])[1];
 if((table==='local_ai_store_hours'&&window.smokeFailHours)||(table==='local_ai_reviews'&&window.smokeFailReviews))return new Response('Falha simulada de rede',{status:503});
 const values={local_ai_stores:stores.filter(s=>s.id!==window.smokeDisableStore),local_ai_products:products,local_ai_store_hours:hours,local_ai_store_highlights:[{store_id:'sushi',highlight_type:'verified',active:true},{store_id:'pizza',highlight_type:'normal',active:true},{store_id:'sweet',highlight_type:'sponsored',active:true}],local_ai_reviews:[],local_ai_store_knowledge:[{store_id:'pizza',question:'tem estacionamento?',variations:['possui estacionamento?'],answer:'Sim, tem estacionamento.',active:true},{store_id:'pizza',question:'ela faz entrega?',variations:[],answer:'Não, ela não faz entrega.',active:true}],local_ai_taxonomy_categories:[{id:'c1',name:'Comida',active:true}],local_ai_taxonomy_groups:[{id:'g1',category_id:'c1',name:'Japonesa',active:true},{id:'g2',category_id:'c1',name:'Pizzaria',active:true},{id:'g3',category_id:'c1',name:'Doceria',active:true}],local_ai_taxonomy_terms:[{id:'t1',category_id:'c1',group_id:'g3',term:'doces',active:true}]};
 return new Response(JSON.stringify(values[table]||[]),{status:200,headers:{'Content-Type':'application/json'}});
};
</script>
<script type="module" src="../guru-engine-v4.js?v=5"></script>
<script type="module">
async function smoke(){
 const sleep=ms=>new Promise(r=>setTimeout(r,ms));
 for(let i=0;i<100&&!window.GuruEngineV4;i++)await sleep(50);
 if(!window.GuruEngineV4)throw Error('motor não inicializou');
 const guru=window.GuruEngineV4;
 // Identifica a última consulta caso o teste visual pare antes de concluir.
 const submitOriginal=guru.submitText;
 guru.submitText=(...args)=>{document.body.setAttribute('data-report','Verificando: '+String(args[0]).slice(0,90));return submitOriginal(...args)};
 await guru.refresh();
 const inputSuggest=document.getElementById('q');
 inputSuggest.value='Pizza';inputSuggest.dispatchEvent(new Event('input',{bubbles:true}));
 const suggestions=document.getElementById('guruSuggestions');
 if(suggestions.hidden)throw Error('Autocomplete não apareceu');
 const suggestionsText=suggestions.textContent;
 if(!suggestionsText.includes('Pizza Teste')||!suggestionsText.includes('Pizza Tradicional'))throw Error('Sugestões de loja e produto ausentes');
 if(suggestionsText.includes('Pendente Teste'))throw Error('Sugestão incluiu loja inativa');
 inputSuggest.value='zztermo desconhecido';inputSuggest.dispatchEvent(new Event('input',{bubbles:true}));
 if(!suggestions.hidden)throw Error('Autocomplete deve permitir busca livre sem sugestões');
 inputSuggest.value='';inputSuggest.dispatchEvent(new Event('input',{bubbles:true}));
 const firstRequest=guru.submitText('negócio de comida japonesa');
 const typing=document.querySelector('.guru-typing');
 if(!typing)throw Error('Indicador de digitação não apareceu');
 if(!document.body.classList.contains('chat-started'))throw Error('Transição inicial para chat não ocorreu');
 if(typing.querySelectorAll('.guru-typing-dot').length!==3)throw Error('Indicador deve ter três pontos');
 if(typing.getAttribute('role')!=='status')throw Error('Indicador não acessível');
 if(document.querySelector('.store-result-card'))throw Error('Resultados apareceram antes da digitação terminar');
 await sleep(150);
 if(!document.querySelector('.guru-typing'))throw Error('Indicador desapareceu cedo demais');
 // Assim que os três pontos somem, o texto deve aparecer progressivamente.
 // O resultado em cards não pode aparecer antes de o texto introdutório terminar.
 let writing=null;
 for(let i=0;i<35&&!writing;i++){writing=document.querySelector('.guru-typewriter-caret');if(!writing)await sleep(35)}
 if(!writing)throw Error('Efeito de escrita gradual não começou');
 const intro=writing.closest('.hashtag-intro');
 if(!intro)throw Error('Introdução dos resultados não está sendo escrita');
 const firstChars=intro.textContent;
 const grid=intro.parentElement.querySelector('.store-results-grid');
 if(!grid||getComputedStyle(grid).display!=='none')throw Error('Cards apareceram antes da introdução terminar');
 await sleep(120);
 if(intro.textContent.length<=firstChars.length)throw Error('O texto não está aparecendo letra por letra');
 await firstRequest;
 if(document.querySelector('.guru-typing'))throw Error('Indicador não foi removido ao finalizar');
 if(document.querySelector('.guru-typewriter-caret'))throw Error('Cursor não desapareceu ao terminar');
 if(getComputedStyle(grid).display==='none')throw Error('Cards não foram exibidos após a escrita');
 // Depois de verificar a escrita gradual, simule a preferência de movimento reduzido.
 // Assim os demais testes funcionais não gastam todo o tempo virtual do Chrome.
 const nativeMatchMedia=window.matchMedia.bind(window);
 let smokeReducedMotion=true;
 window.matchMedia=query=>query==='(prefers-reduced-motion: reduce)'?{matches:smokeReducedMotion,media:query}:nativeMatchMedia(query);
 if(!document.querySelector('.store-result-card h3')?.textContent?.includes('Sushi Teste'))throw Error('busca japonesa falhou');
 if(![...document.querySelectorAll('.store-result-card .store-chip')].some(el=>el.textContent==='Verificada'))throw Error('Destaque verificada não aparece quando flag COREDB é falsa');
 guru.reset();
 await guru.submitText('comida');
 const latestGrid=[...document.querySelectorAll('.store-results-grid')].at(-1);
 const orderedNames=[...(latestGrid?.querySelectorAll('.store-result-card h3')||[])].map(el=>el.textContent);
 const desiredOrder=['Doceria Teste','Sushi Teste','Pizza Teste'];
 if(JSON.stringify(orderedNames)!==JSON.stringify(desiredOrder))
  throw Error('Cards não respeitam Patrocinada > Verificada > Normal: '+JSON.stringify(orderedNames));
 await guru.submitText('loja de comida japonesa');
 const recentCards=[...document.querySelectorAll('.store-result-card h3')];
 if(!recentCards.some(x=>x.textContent==='Sushi Teste'))throw Error('loja de comida japonesa não encontrou estabelecimento válido');
 // Consulta pelo item real do catálogo, independentemente de "ajuda", "achar" e outros verbos.
 const catalogPlan=guru.interpret('Por favor, me ajude a achar um combo sushi');
 if(catalogPlan.productTerm!=='sushi')throw Error('Busca ignorou o catálogo ou exigiu palavras conversacionais');
 await guru.submitText('Por favor, você acha onde tem combo sushi disponível?');
 const catalogCards=[...document.querySelectorAll('.store-results-grid')].at(-1);
 if(catalogCards?.querySelector('h3')?.textContent!=='Sushi Teste')
  throw Error('Pesquisa por produto real não encontrou a loja correspondente');
 // Audita no navegador as expressões que antes viravam filtros de produtos incorretos.
 for(const query of [
  'Por acaso você saberia me dizer onde tem uma pizzaria?',
  'Estou pensando em comer pizza, tem algum lugar?',
  'Estou sem ideias de onde comer pizza. Pode ajudar?',
  'Poderia recomendar uma pizzaria bem avaliada?',
  'Você tem alguma sugestão de pizzaria que permita retirada?'
 ]){
  const parsed=guru.interpret(query);
  if(parsed.kind!=='search'||parsed.taxon?.group!=='Pizzaria'||parsed.productTerm)
   throw Error('Interpretação de busca de pizzaria falhou: '+query);
 }
 if(guru.interpret('Gostaria de uma pizzaria que faça entrega e aceite Pix.').filters.delivery!==true)
  throw Error('Frase faça entrega não ativou o filtro correto');
 if(guru.interpret('Poderia recomendar uma pizzaria bem avaliada?').filters.sort!=='rating')
  throw Error('Frase bem avaliada não ativou ordenação por nota');
 if(guru.interpret('Você tem alguma sugestão de pizzaria que permita retirada?').filters.pickup!==true)
  throw Error('Frase permita retirada não ativou filtro de retirada');
 if(guru.interpret('Pizzaria que não faz entrega.').filters.delivery!==false)
  throw Error('Negação de entrega foi invertida');
 if(guru.interpret('Quero uma pizzaria que leve a pizza em casa.').filters.delivery!==true)
  throw Error('Entrega em casa não reconhecida');
 if(guru.interpret('Preciso buscar a pizza no balcão.').filters.pickup!==true)
  throw Error('Retirada no balcão não reconhecida');
 if(guru.interpret('Pizzaria com pizza de calabresa até R$ 50.').productTerm!=='calabresa')
  throw Error('Sabor de pizza não gerou exigência de produto');
 if(guru.interpret('Tem pizza de chocolate nessas pizzarias?').productTerm!=='chocolate')
  throw Error('Produto inexistente pode gerar falso positivo');
 const checkPix=guru.interpret('Pizzaria que aceita Pix e cartão.');
 if(!checkPix.filters.paymentsAll || checkPix.filters.paymentsAll.length!==2)throw Error('Filtros de pagamento cumulativo falharam');
 await guru.submitText('Tem algum lugar que prepare pizzas?');
 const pizzaNaturalCards=[...document.querySelectorAll('.store-results-grid')].at(-1);
 if(pizzaNaturalCards?.querySelector('h3')?.textContent!=='Pizza Teste')
  throw Error('Busca natural por pizza não trouxe a pizzaria cadastrada');
 if([...pizzaNaturalCards.querySelectorAll('.store-chip')].some(el=>el.textContent==='Verificada'))throw Error('Loja Normal exibiu Verificada por causa da flag legada do COREDB');
 await guru.submitText('Gostaria de uma pizzaria que faça entrega e aceite Pix.');
 const pizzaFilteredCards=[...document.querySelectorAll('.store-results-grid')].at(-1);
 if(pizzaFilteredCards?.querySelector('h3')?.textContent!=='Pizza Teste')
  throw Error('Busca com entrega e Pix não trouxe a pizzaria cadastrada');
 await guru.submitText('pode me indicar uma confeitaria?');
 if(![...document.querySelectorAll('.store-result-card h3')].some(x=>x.textContent==='Doceria Teste'))throw Error('Sinônimo local foi perdido ao carregar taxonomia dinâmica');
 await guru.submitText('Por favor, quero uma doceria aberta no sábado');
 const courtesyCards=[...document.querySelectorAll('.store-results-grid')].at(-1);
 if(courtesyCards?.querySelector('h3')?.textContent!=='Doceria Teste')throw Error('Frase com por favor gerou falso negativo de doceria aberta sábado');
 await guru.submitText('Por favor, me diga uma doceria');
 const requestCards=[...document.querySelectorAll('.store-results-grid')].at(-1);
 if(requestCards?.querySelector('h3')?.textContent!=='Doceria Teste')throw Error('Pedido me diga uma doceria não encontrou a loja cadastrada');
 await guru.submitText('Eu adoraria saber se você poderia gentilmente apresentar alguma doceria interessante?');
 const intentCards=[...document.querySelectorAll('.store-results-grid')].at(-1);
 if(intentCards?.querySelector('h3')?.textContent!=='Doceria Teste')throw Error('Termos conversacionais eliminam doceria válida');
 await guru.submitText('Quero uma doceria chamada Fantasma');
 if(!document.getElementById('msgs').textContent.includes('nenhum atende a todos os critérios desta pesquisa'))throw Error('Nome de loja explícito não restringiu resultados');

 // As consultas em português devem conservar categoria, grupo e dias pretendidos.
 const weekend=guru.interpret('Tem alguma loja de doces funcionando no fim de semana?');
 if(weekend.kind!=='search'||weekend.taxon?.group!=='Doceria'||JSON.stringify(weekend.filters?.days)!=='[0,6]')throw Error('Consulta de fim de semana não foi interpretada corretamente');
 const openNow=guru.interpret('Quais docerias estão abertas agora?');
 if(openNow.kind!=='search'||openNow.taxon?.group!=='Doceria'||openNow.filters?.openNow!==true)throw Error('Busca de docerias abertas agora não foi interpretada corretamente');
 await guru.submitText('pizzaria com entrega em promoção até R$ 40');
 const cards=[...document.querySelectorAll('.store-result-card')];
 if(cards.at(-1)?.querySelector('h3')?.textContent!=='Pizza Teste')throw Error('filtro de promoção falhou');
 smokeReducedMotion=false;
 const hoursRequest=guru.submitText('a primeira abre sábado?');
 let writingReply=null;
 for(let i=0;i<40&&!writingReply;i++){writingReply=document.querySelector('.guru-typewriter-caret');if(!writingReply)await sleep(40)}
 if(!writingReply||writingReply.classList.contains('hashtag-intro'))throw Error('Resposta textual não recebeu escrita gradual');
 await hoursRequest;
 smokeReducedMotion=true;
 if(!document.getElementById('msgs').textContent.includes('sábado das 11:00 às 13:00 e das 17:00 às 23:00'))throw Error('Resposta de dois turnos falhou');
 if(guru.getState().filters.day!=null)throw Error('Pergunta de horário gravou sábado como filtro de busca');
 await guru.submitText('tem estacionamento?');
 if(!document.getElementById('msgs').textContent.includes('Sim, tem estacionamento.'))throw Error('resposta cadastrada do lojista não funcionou');
 await guru.submitText('Ela faz entrega?');
 if(!document.getElementById('msgs').textContent.includes('Sim, Pizza Teste oferece entrega'))throw Error('Conhecimento desatualizado contradisse entrega cadastrada');
 await guru.submitText('Quais produtos vende?');
 if(!document.getElementById('msgs').textContent.includes('Na Pizza Teste, encontrei:'))throw Error('Pergunta de produtos não manteve loja selecionada');
 await guru.submitText('Agora quero encontrar uma doceria.');
 if(guru.getState().group!=='Doceria'||guru.getState().filters.promoOnly||guru.getState().selectedStore)throw Error('Troca de categoria herdou filtros ou loja antiga');
 const resultCards=[...document.querySelectorAll('.store-results-grid')];
 const lastCard=resultCards.at(-1)?.querySelector('.store-result-card');
 if(!lastCard||lastCard.querySelector('h3')?.textContent!=='Doceria Teste')throw Error('Nova categoria deixou de encontrar doceria');
 if(![...lastCard.querySelectorAll('.store-chip')].some(el=>el.textContent==='Patrocinada'))throw Error('Destaque Patrocinada não foi preservado');
 lastCard.querySelector('.store-action.primary')?.click();
 if(guru.getState().selectedStore?.id!=='sweet')throw Error('Seleção do card não preservou a loja');
 window.smokeFailHours=true;
 await guru.refresh();
 await guru.submitText('doceria aberta no sábado');
 if(!document.getElementById('msgs').textContent.includes('Não consegui consultar os horários agora'))throw Error('Falha de horários foi apresentada como ausência de lojas');
 if(guru.getState().selectedStore?.id!=='sweet')throw Error('Falha de rede apagou seleção anterior');
 window.smokeFailHours=false;window.smokeFailReviews=true;await guru.refresh();
 await guru.submitText('Qual a avaliação?');
 if(!document.getElementById('msgs').textContent.includes('Não consegui consultar as avaliações dessa loja agora'))throw Error('Falha de avaliações foi apresentada como falta de avaliação');
 await guru.submitText('pizzaria nota acima de 4');
 if(!document.getElementById('msgs').textContent.includes('Não consegui consultar as avaliações agora'))throw Error('Filtro de nota ignorou falha no banco');
 if(guru.getState().selectedStore?.id!=='sweet')throw Error('Falha de avaliações alterou loja selecionada');
 window.smokeFailReviews=false;await guru.refresh();
 window.smokeDisableStore='sweet';
 await guru.refresh();
 if(guru.getState().selectedStore||guru.getState().lastResults.some(r=>r.store.id==='sweet'))throw Error('Loja removida do banco permaneceu selecionável após atualização');
 await guru.submitText('Por favor, poderia me recomendar uma doceria');
 if(!document.getElementById('msgs').textContent.includes('Não há estabelecimentos ativos cadastrados como Doceria'))throw Error('Falta de docerias foi descrita incorretamente como erro de filtros');
 window.smokeDisableStore=null;await guru.refresh();
 const input=document.getElementById('q');
 const cardsBeforeSubmit=document.querySelectorAll('.store-results-grid').length;
 input.value='lojas com entrega';document.getElementById('chatForm').requestSubmit();
 for(let i=0;i<80&&document.querySelectorAll('.store-results-grid').length<=cardsBeforeSubmit;i++)await sleep(50);
 if(document.querySelectorAll('.store-results-grid').length<=cardsBeforeSubmit)throw Error('submit do formulário não gerou novos resultados');
 for(let i=0;i<120&&input.disabled;i++)await sleep(50);
 if(input.disabled)throw Error('Envio anterior não terminou antes do teste de filtros');
 guru.reset();
 await guru.submitText('pizzaria com entrega');
 const deliveryChip=[...document.querySelectorAll('#ctx .guru-filter-chip')].find(e=>e.textContent.includes('Com entrega'));
 if(!deliveryChip)throw Error('Filtro ativo não apareceu em etiqueta');
 deliveryChip.click();
 if(guru.getState().filters.delivery!==undefined)throw Error('Remoção do filtro não atualizou o contexto');
 if(![...document.querySelectorAll('#ctx .guru-filter-chip')].some(e=>e.textContent.includes('Pizzaria')))throw Error('Filtro de pizzaria desapareceu indevidamente');
 guru.reset();
 if(document.body.classList.contains('chat-started'))throw Error('Nova busca não retornou à tela inicial');
 if(document.querySelectorAll('#ctx .guru-filter-chip').length)throw Error('Filtros antigos permaneceram após nova busca');
 document.body.dataset.smoke='PASS';
 document.body.setAttribute('data-report','Busca + regra + promoção + contexto + envio OK');
}
smoke().catch(e=>{document.body.dataset.smoke='FAIL';document.body.setAttribute('data-report',e.message);console.error(e)});
</script>
</body></html>
